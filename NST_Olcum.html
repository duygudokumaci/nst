<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NST Ölçüm Oturumu</title>
<style>
:root{
  --bg:#f2f4f8; --card:#ffffff; --ink:#1c2333; --muted:#5b6477; --line:#dce1ea;
  --pri:#1f5fa8; --pri-2:#174a85; --bar:#1e3a62;
  --ok:#1d7340; --okbg:#e6f4ec; --bad:#b0261c; --badbg:#fcebea; --warn:#7a5200; --warnbg:#fff3d1;
  --chat-p:#eef1f6; --chat-s:#d9e8fb; --chat-m:#e3f3e9;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--bar);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;position:sticky;top:0;z-index:20}
header .brand{font-weight:700;font-size:16px}
header .who{opacity:.85;font-size:13px}
header .case{font-weight:600;margin-left:auto}
.stepper{display:flex;gap:4px;flex-wrap:wrap;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:44px;z-index:19}
.stepper span{font-size:12.5px;padding:3px 10px;border-radius:999px;background:#eef1f6;color:var(--muted)}
.stepper span.on{background:var(--pri);color:#fff}
.stepper span.done{background:var(--okbg);color:var(--ok)}
main{max-width:1440px;margin:0 auto;padding:14px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:14.5px;margin:14px 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.grid > *,.stack > *{min-width:0}
html,body{overflow-x:hidden}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}.stepper{top:0;position:static}header{position:static}header .case{margin-left:0}main{padding:10px 10px 30px}}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:#f5f7fb}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1 1 180px}
input[type=text],input[type=number],select{border:1px solid #c9d0dc;border-radius:8px;padding:8px 10px;background:#fff;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid #7fb0ec;outline-offset:1px}
.persona b{font-weight:650}
.vitals{margin-top:6px;padding:8px 10px;border-radius:8px;background:#f6f8fb;font-size:13.5px}
/* sohbet */
.chat{height:min(56vh,520px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.msg{max-width:84%;padding:8px 12px;border-radius:14px;white-space:pre-wrap}
.msg .who{display:block;font-size:11.5px;font-weight:700;opacity:.7;margin-bottom:1px}
.msg.p{background:var(--chat-p);align-self:flex-start;border-bottom-left-radius:4px}
.msg.s{background:var(--chat-s);align-self:flex-end;border-bottom-right-radius:4px}
.msg.m{background:var(--chat-m);align-self:center;font-size:13.5px}
.chatform{display:flex;gap:8px;margin-top:10px}
.chatform input{flex:1}
/* geri bildirim */
.fb{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.fb div{padding:8px 10px;border-radius:8px;font-size:13.8px}
.fb .ok{background:var(--okbg);color:#14532d}
.fb .bad{background:var(--badbg);color:#7f1d1d}
.fb .info{background:#eef3fb;color:#1e3a62}
.fb .warn{background:var(--warnbg);color:#5c3d00}
/* trase */
.tracewrap canvas{width:100%;height:clamp(300px,52vh,520px);display:block;touch-action:pan-y;cursor:grab;border-radius:6px}
.tracectl{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.tracectl input[type=range]{flex:1 1 200px}
.rec{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:#b0261c}
.rec::before{content:"";width:9px;height:9px;border-radius:50%;background:#d93025;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
/* form */
.form{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 10px;align-items:center}
.form label{font-weight:600;font-size:14px}
.form .state{grid-column:2;font-size:12.5px;margin-top:-4px}
.locked{background:#f1f5f2 !important}
/* karar */
.opts{display:flex;flex-direction:column;gap:6px}
.opts label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:#fff}
.opts label:hover{background:#f7f9fc}
.opts input{margin-top:3px;flex:none;width:18px;height:18px}
/* özet */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{background:#f6f8fb;border-radius:10px;padding:10px}
.tile .v{font-size:22px;font-weight:700}
.tile .k{font-size:12.5px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:650}
.qr{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.qr .svg{background:#fff;padding:6px;border:1px solid var(--line);border-radius:8px;width:min(260px,70vw)}
.qr .svg svg{width:100%;height:auto;display:block}
.code{font:12px/1.4 ui-monospace,Consolas,monospace;word-break:break-all;background:#f6f8fb;border-radius:8px;padding:8px;max-height:90px;overflow:auto}
/* uygulama */
.ill svg{width:100%;height:auto;max-height:70vh;display:block;margin:0 auto}
.zone{cursor:pointer}
.zone .hit{fill:rgba(31,95,168,0.0);stroke:rgba(31,95,168,0.0);stroke-width:2;transition:fill .15s}
.zone:hover .hit,.zone.armed .hit{fill:rgba(31,95,168,0.10);stroke:rgba(31,95,168,0.55);stroke-dasharray:5 4}
.zone.leo .hit{fill:rgba(31,95,168,0.07);stroke:rgba(31,95,168,0.6);stroke-dasharray:5 4}
.zone.leo:hover .hit{fill:rgba(31,95,168,0.16)}
.zone.palp .hit{fill:rgba(29,115,64,0.10);stroke:rgba(29,115,64,0.6)}
.zone text{pointer-events:none;font-size:12px;fill:#1e3a62;font-weight:600}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{border:2px solid var(--line);border-radius:12px;background:#fff;padding:10px 6px;text-align:center;cursor:grab;touch-action:none;user-select:none;font-weight:600;font-size:13px}
.tool .ic{display:block;margin:0 auto 4px;width:38px;height:38px}
.tool.sel{border-color:var(--pri);background:#eaf2fd}
.tool.used{opacity:.5}
.tool:disabled{opacity:.35;cursor:not-allowed}
.ghost{position:fixed;pointer-events:none;z-index:99;width:54px;height:54px;border-radius:50%;background:rgba(31,95,168,.85);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.steps li{padding:6px 10px;border-radius:8px;font-size:13.5px;color:var(--muted);background:#f6f8fb}
.steps li.on{background:#eaf2fd;color:var(--ink);font-weight:650}
.steps li.ok{background:var(--okbg);color:var(--ok)}
.posopt{display:flex;flex-direction:column;gap:6px}
.posopt button{text-align:left}
.say{background:#fff8e6;border-left:4px solid #e0a100;padding:8px 10px;border-radius:6px;font-style:italic}
.find{font-size:13.5px;padding:6px 10px;border-radius:8px;background:#f2f8f4;margin-top:4px}
.heart{display:inline-flex;gap:6px;align-items:center;font-weight:700;color:#b0261c}
.heart::before{content:"♥";animation:beat .45s infinite alternate}
@keyframes beat{to{transform:scale(1.25)}}
.center{max-width:620px;margin:6vh auto}
.err{color:var(--bad);font-weight:600}
.hidden{display:none !important}
/* ölçüm oturumu */
textarea{border:1px solid #c9d0dc;border-radius:8px;padding:8px 10px;background:#fff;width:100%;min-height:72px;resize:vertical}
.wide{max-width:860px;margin:0 auto}
.q{padding:10px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q > b{display:block;margin-bottom:6px;font-weight:650}
.q .help{display:block;font-size:12.5px;color:var(--muted);margin:-4px 0 6px}
.radios{display:flex;flex-direction:column;gap:4px}
.radios label{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}
.radios label:hover{background:#f5f7fb}
.radios input{margin-top:4px;flex:none}
.likert{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.likert label{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:11.5px;color:var(--muted);padding:6px 2px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.likert label:has(input:checked){background:#eaf2fd;border-color:var(--pri);color:var(--ink)}
.qtrace{width:100%;height:clamp(230px,36vh,330px);display:block;border-radius:6px;margin:4px 0 8px}
.consent{white-space:pre-wrap;max-height:50vh;overflow:auto;background:#f6f8fb;border-radius:8px;padding:10px 12px;font-size:14px}
.missing{background:var(--warnbg);color:#5c3d00;border-radius:8px;padding:8px 10px;font-size:13.5px}
.status{padding:10px 12px;border-radius:8px;font-weight:600}
.status.ok{background:var(--okbg);color:#14532d}
.status.bad{background:var(--badbg);color:#7f1d1d}
.status.wait{background:#eef3fb;color:#1e3a62}
</style>
</head>

gri":"Ağrım yok. Arada bir karnım sertleşiyor ama ağrısız, kısa sürüyor ve düzenli değil.","kanama":"Hayır, kanamam yok.","su":"Hayır, su gelmesi olmadı.","ilac":"İnsülin kullanmıyorum, diyetle kontrol ediyoruz. Demir ve vitamin içiyorum. Kan şekerimi günde dört kez ölçüyorum, açlık genelde 85–90 civarında.","kronik":"Gebelikten önce bilinen bir hastalığım yoktu. Bu gebelikte gebelik şekeri çıktı, o kadar.","tansiyon":"Tansiyonum hep normal çıktı. Baş ağrısı, görme bozukluğu ya da şişlik yok.","beslenme":"Yaklaşık bir saat önce diyetisyenimin önerdiği gibi kahvaltı yaptım.","sigara":"Hayır, sigara ya da alkol kullanmıyorum.","alerji":"Bilinen bir alerjim yok.","enfeksiyon":"Ateşim yok, idrar yaparken yanma da olmuyor.","duygu":"Biraz endişeliyim, şekerim bebeğe zarar verir mi diye düşünüyorum. Ama sonuçlar hep iyi çıktı.","bilgilendirme":"Tamam, anladım. Karnıma bağlanan kemerler bebeğin kalp atışını ve kasılmaları kaydedecek, değil mi? Bebeğim hareket ettiğinde bu düğmeye basacağım.","pozisyon":"Böyle yarı oturur, hafif sola dönük şekilde rahatım.","tesekkur":"Ben teşekkür ederim."},"critical":["sikayet","gebelik_haftasi","hareket","agri","kanama","su","ilac","kronik","beslenme","bilgilendirme","vital"],"key":{"baseline":135,"variabilite":"Orta","akselerasyon":"Var","deselerasyon":"Yok","sonuc":"Reaktif","kategori":"Kategori I"},"hints":{"baseline":["Bazal FKH; akselerasyon, deselerasyon ve belirgin dalgalanma dönemleri dışında kalan bölümlerde (en az 2 dk) gözlenen ortalama kalp hızıdır ve 5 atım/dk'ya yuvarlanır. Normal aralık 110–160 atım/dk'dır.","Vurgulanan bölümde akselerasyonların dışında kalan sakin traseye bakın. Çizgi çoğunlukla hangi iki yatay ızgara çizgisi arasında seyrediyor?","Bazal FKH yaklaşık 135 atım/dk'dır (normal aralık 110–160). ±5 atım/dk tolerans kabul edilir."],"variabilite":["Variabilite, bazal hattaki dakikalık dalgalanmaların tepe–çukur genliğidir: Yok (saptanamaz), Minimal (≤5), Orta (6–25), Belirgin (>25 atım/dk).","Vurgulanan 1–2 daki dk'dır.","Vurgulanan 10 dakikalık bölümde trasenin ortalama seviyesini ızgaradan okuyun.","Bazal FKH yaklaşık 145 atım/dk'dır ve normal aralıktadır."],"variabilite":["Variabilite, bazal hattaki dakikalık dalgalanmaların tepe–çukur genliğidir: Yok (saptanamaz), Minimal (≤5), Orta (6–25), Belirgin (>25 atım/dk).","Vurgulanan dakikada dalgalanmanın tepe–çukur farkı bir ızgara aralığını (10 atım/dk) geçiyor mu, yoksa bunun yarısından da mı az?","Minimal variabilite: Tepe–çukur genliği yaklaşık 3–5 atım/dk'dır (≤5) ve trase 'düz' görünür. Fetal uyku, ilaçlar, sigara veya hipoksi buna neden olabilir."],"akselerasyon":["32. gebelik haftası ve sonrasında akselerasyon, FKH'nin bazalin en az 15 atım/dk üzerine çıkıp en az 15 saniye sürmesidir (32 haftadan önce 10×10).","Vurgulanan bölgede küçük bir yükselme var. Bazalden kaç atım/dk yükseliyor ve kaç saniye sürüyor? 34 haftalık bir fetüs için ölçüt nedir?","Yok. Kayıttaki küçük yükselmeler yalnızca yaklaşık 8 atım/dk ve 15 saniyeden kısadır. 32 haftanın üzerindeki fetüs için gereken 15×15 ölçütünü karşılamazlar."],"deselerasyon":["Deselerasyonu sınıflarken üç şeye bakın: başlangıçtan en düşük noktaya (nadir) kadar geçen süre (kademeli ≥30 sn, ani <30 sn), kasılmayla zamansal ilişki ve toplam süre (uzamış: ≥2 dk).","Kaydın tamamını tarayın. FKH'nin bazalin belirgin altına indiği bir dönem ya da uterus aktivitesi var mı?","Yok. Kayıt boyunca deselerasyon ve uterus kasılması izlenmemektedir."],"sonuc":["NST, 20 dakikalık kayıtta ölçütü karşılayan en az 2 akselerasyon varsa reaktiftir. Ölçüt 40 dakikalık kayıtta da karşılanmazsa non-reaktiftir.","Kayıt süresine (40 dakika) ve ölçütü karşılayan akselerasyon sayısına birlikte bakın.","Non-reaktif. 40 dakikalık kayıtta 15×15 ölçütünü karşılayan akselerasyon yoktur. Fetal uyku dönemi genellikle 20–40 dakika sürer; 40 dakikayı aşan non-reaktivite ileri değerlendirme gerektirir."],"kategori":["NICHD sınıflaması: Kategori I'de tüm bulgular normaldir. Kategori III; variabilite yokken tekrarlayan geç/değişken deselerasyon ya da bradikardi varsa veya sinüzoidal paternde konur. Bu ikisinin dışında kalan her trase Kategori II'dir.","Variabilite bulgunuzu Kategori I tanımıyla karşılaştırın. Kategori I için variabilite hangi düzeyde olmalıdır?","Kategori II. Deselerasyon olmasa da minimal variabilite Kategori I ölçütlerini karşılamaz. Variabilite yok olmadığı için de Kategori III değildir."]},"hintRegion":{"baseline":[10,20],"variabilite":[12,14],"akselerasyon":[18.5,20],"deselerasyon":[0,40],"sonuc":[0,40],"kategori":[12,14]},"decisions":[{"text":"Non-reaktif sonucu derhal hekime bildirmek","correct":true,"why":"40 dakikayı aşan non-reaktif NST ileri değerlendirme gerektirir; karar hekimle birlikte verilir."},{"text":"Hekim istemiyle vibroakustik stimülasyon (VAS) uygulamak","correct":true,"why":"VAS fetüsü uyandırarak akselerasyon ortaya çıkarabilir ve fetal uykuyu gerçek bozulmadan ayırt etmeye yardım eder."},{"text":"Biyofizik profil (USG) veya CST için hazırlık yapmak","correct":true,"why":"ACOG'a göre non-reaktif NST'den sonra BPP veya CST gibi ek testler yapılır."},{"text":"İzlemi sürdürüp gebeyi sol yan yatış pozisyonuna almak","correct":true,"why":"Sol yan yatış uteroplasental kan akımını artırır. Değerlendirme tamamlanana kadar fetal izlem sürer."},{"text":"Gebeye duygusal destek vermek ve süreci açıklamak","correct":true,"why":"Gebe çok endişeli. Bilgilendirme ve destek hemşirelik bakımının parçasıdır."},{"text":"Sigara bırakma danışmanlığını bakım planına almak","correct":true,"why":"Sigara, fetal büyüme kısıtlılığı ve azalmış variabilite ile ilişkilidir. Bırakma desteği planlanmalıdır."},{"text":"Fetal uyku kabul edip gebeyi taburcu etmek","correct":false,"why":"40 dakikayı aşan non-reaktivite ve azalmış hareket şikâyeti varken taburculuk güvenli değildir."},{"text":"Şekerli içecek verip sonucu normal kabul etmek","correct":false,"why":"Gebeye glukoz verilmesinin NST reaktivitesini artırdığına dair kanıt yoktur ve bu yaklaşım ileri değerlendirmeyi geciktirir."},{"text":"Bir hafta sonrasına NST randevusu vermek","correct":false,"why":"Mevcut bulgu bugün değerlendirilmelidir; ertelemek risklidir."},{"text":"Gebeyi sırt üstü pozisyonda izlemek","correct":false,"why":"Sırt üstü pozisyon vena kava basısına yol açarak uteroplasental perfüzyonu azaltabilir."}],"priorityIdx":0,"decisionHints":["40 dakikalık non-reaktif bir NST'den sonra ACOG hangi ek testleri önerir? Fetüsü 'uyandırmak' için kanıtı olan yöntem hangisidir?","Anamnezdeki risk faktörlerini (azalmış hareket, sigara, aç kalma, kaygı) ve gebenin pozisyonunu düşünün. Hangi seçenekler kanıta dayalı değildir?"],"debrief":["Tepkiler: Bu senaryoda kendinizi nasıl hissettiniz?","Açıklama: Kısaca bu vakada neler oldu? Bu gebenin temel sorunu neydi?","Analiz: NST'yi değerlendirirken hangi bulgulara dayandınız?","Analiz: Kararınızı etkileyen temel bulgu neydi? Alternatif yorumlarınız var mıydı?","Analiz: Fetal uyku dönemini gerçek bir fetal tehlikeden nasıl ayırt edersiniz? Anamnezdeki hangi bilgiler (azalmış hareket, sigara, açlık) yorumunuzu etkiledi?","Özet: Bu vakadan çıkardığınız en önemli ders neydi?","Özet: Gerçek klinik uygulamada benzer bir NST ile karşılaştığınızda neyi farklı yaparsınız?"],"decOrder":[8,7,1,9,3,0,2,4,5,6],"procedure":{"backSide":"sag","presentation":"Baş (verteks)","dopplerZone":"sag_alt","leopold":{"fundus":"Fundusta yumuşak, düzensiz ve iri bir kitle palpe ediliyor: makat (kalça).","sag":"Hastanın sağ yanında düz, sert ve kesintisiz bir yüzey hissediliyor: fetal sırt.","sol":"Hastanın sol yanında küçük, düzensiz ve hareketli çıkıntılar hissediliyor: ekstremiteler.","simfiz":"Simfiz üstünde sert, yuvarlak ve hareketli bir kitle: baş (verteks), henüz pelvise girmemiş."},"supineReaction":"Sırt üstü yatınca biraz başım dönüyor."},"trace":{"fs":4,"dur":40,"fhr":[146.7,146.7,146.7,146.7,147,147.1,147.4,147.5,147.4,147.1,147.1,147.2,147.3,147.6,147.5,147.4,147.2,147,146.9,146.7,146.7,146.6,146.7,146.4,146.5,146.3,146.1,146,145.8,145.7, "Ani başlayan, kasılmayla zamansal ilişkisi olmayan düşüş","Kademeli başlayan, en düşük noktası kasılmanın tepesiyle eşzamanlı olan düşüş","En az 2 dakika süren, bazale 10 dakikadan önce dönen düşüş","Kademeli başlayan, en düşük noktası kasılmanın tepesinden sonra gelen düşüş"],"dogru":3},{"soru":"39 haftalık bir gebeye ait bu trasede (Trase C) görülen deselerasyonlar hangi tiptir?","trase":"C","secenekler":["Erken deselerasyon","Geç deselerasyon","Değişken deselerasyon","Uzamış deselerasyon"],"dogru":0},{"soru":"Değişken deselerasyonların en sık nedeni hangisidir?","trase":"","secenekler":["Fetal baş basısı","Kordon basısı","Uteroplasental yetmezlik","Fetal uyku dönemi"],"dogru":1},{"soru":"Geç deselerasyonların altında yatan temel mekanizma hangisidir?","trase":"","secenekler":["Uteroplasental yetmezlik","Kordon basısı","Fetal baş basısına bağlı vagal yanıt","Maternal ateş"],"dogru":0},{"soru":"Bu 10 dakikalık kayıtta (Trase C) kaç uterus kasılması vardır?","trase":"C","secenekler":["1","2","3","5"],"dogru":2},{"soru":"38 haftalık gebeye ait bu trase (Trase B) NICHD sınıflamasına göre hangi kategoridedir?","trase":"B","secenekler":["Kategori I","Kategori II","Kategori III","Sınıflandırılamaz"],"dogru":1},{"soru":"Aşağıdakilerden hangisi Kategori I trasenin özelliklerinden biri DEĞİLDİR?","trase":"","secenekler":["Bazal FKH'nin 110–160 atım/dk arasında olması","Orta variabilite","Tekrarlayan geç deselerasyonlar","Erken deselerasyonların bulunabilmesi"],"dogru":2},{"soru":"39 haftalık gebeye ait bu trase (Trase D) NICHD sınıflamasına göre hangi kategoridedir?","trase":"D","secenekler":["Kategori I","Kategori II","Kategori III","Sınıflandırılamaz"],"dogru":2},{"soru":"Tekrarlayan geç deselerasyon saptanan bir gebede hemşirenin hemen başlatması gereken ilk girişim hangisidir?","trase":"","secenekler":["Gebeyi sol yan yatış pozisyonuna almak","Oksitosin infüzyonunu artırmak","Kaydı 40 dakikaya uzatıp beklemek","Testi sonlandırıp gebeyi taburcu etmek"],"dogru":0},{"soru":"34 haftalık bir gebenin 40 dakikalık NST kaydı non-reaktif bulunmuştur. En uygun yaklaşım hangisidir?","trase":"","secenekler":["Fetal uyku olarak kabul edip gebeyi taburcu etmek","Bir hafta sonrasına yeni NST randevusu vermek","Gebeye şekerli içecek verip sonucu normal kabul etmek","Hekime bildirip biyofizik profil gibi ek değerlendirme planlamak"],"dogru":3},{"soru":"Kategori III trase saptandığında doğru yaklaşım hangisidir?","trase":"","secenekler":["Rutin izleme devam edip bir sonraki kontrolde değerlendirmek","Hemen hekime bildirmek, intrauterin resüsitasyonu başlatmak ve acil doğuma hazırlanmak","Kaydı durdurup gebeyi dinlendirmek","30 dakika sonra kaydı tekrarlamak"],"dogru":1},{"soru":"Verteks gelişte fetal sırtı gebenin sol tarafında olan bir fetüs için NST'de Doppler (ultrason) probu nereye yerleştirilir?","trase":"","secenekler":["Fundusa","Simfizin hemen üstüne","Göbeğin tam üstüne","Gebenin sol alt kadranına"],"dogru":3}],"olcek":{"ad":"Öğrenci Memnuniyeti ve Öğrenmede Kendine Güven Ölçeği","yonerge":"Bu anket formu, simülasyon uygulaması sırasında aldığınız eğitim ile ilgili kişisel düşüncelerinize ilişkin bir dizi açıklamalardan oluşmaktadır. Her bir madde gereksinim duyduğunuz eğitimi alırken öğrenme ve özgüven açısından memnuniyetinize yönelik düşüncelerinizle ilgili bir açıklamayı belirtmektedir. Doğru ya da yanlış hiçbir cevap yoktur. Muhtemelen, bazı ifadelerle ilgili aynı fikirde iken, diğerleri ile aynı fikirde olmayacaksınız. Lütfen davranış ve tutumlarınızı en iyi tarif eden rakamları işaretleyerek kendi düşüncelerinizi belirtiniz. Lütfen cevaplarken düşüncelerinizi olmasını istediğiniz gibi değil, gerçekten olduğu gibi samimiyetle belirtiniz. Bu çalışma, bireysel bir anket olmayıp toplam sonuçlardan oluşan isimsiz bir çalışmadır.","maddeler":["Simülasyonda kullanılan öğretim yöntemleri yararlı ve etkiliydi.","Simülasyon dahili ve cerrahi alanlardaki öğrenmemi geliştirmek için çok çeşitli öğrenme materyalleri ve aktiviteleri sağladı.","Eğiticimin simülasyonu öğretme yönteminden hoşlandım","Simülasyonda kullanılan öğretim materyalleri motive ediciydi ve öğrenmeme yardımcı oldu","Eğitimcimin simülasyonu öğretme tarzı benim öğrenme tarzıma uygundu.","Eğitimcimin bana sunduğu simülasyon uygulamasının içeriğini tam olarak öğrendiğimden eminim.","Bu simülasyon uygulamasının dahili ve cerrahi alanları öğrenmem için gerekli kritik bilgi içeriğini kapsadığından eminim.","Klinik alandaki sorumluluklarımı yerine getirmek için bu simülasyondan gerekli bilgileri edindiğime ve becerilerimi geliştirdiğimden eminim.","Eğitimcilerim bu simülasyonu öğretmek için yararlı kaynaklar kullandılar.","Bu simülasyondan ne öğrenmem gerektiğini bilmek öğrenci olarak benim sorumluluğumdur.","Simülasyondaki kavramları anlamadığımda nasıl yardım alacağımı biliyorum.","Bu becerilerin kritik yönlerini öğrenmek için simülasyonu nasıl kullanacağımı biliyorum.","Simülasyon uygulamasının içeriği ile ilgili ne öğrenmem gerektiğini söylemek eğitimcimin sorumluluğudur."],"secenekler":["Kesinlikle katılmıyorum","Katılmıyorum","Kararsızım","Katılıyorum","Kesinlikle katılıyorum"],"ters":13,"altBoyutlar":[{"ad":"Ogrenci_Memnuniyeti","baslik":"Öğrenmeden Memnuniyet","maddeler":[1,2,3,4,5]},{"ad":"Ogrenmede_Kendine_Guven","baslik":"Öğrenmede Kendine Güven","maddeler":[6,7,8,9,10,11,12,13]}]},"lasater":{"duzeyler":["Başlangıç düzeyinde","Gelişmekte","Başarılı","Örnek niteliğinde"],"boyutlar":[{"asama":"Fark etme","ad":"1. Odaklanmış gözlem","duzey":["Klinik durum, verilerin fazlalığı ve türü nedeniyle kafası karışır; gözlem düzenli değildir, önemli verileri gözden kaçırır ve/veya tanılama hataları yapar.","Çeşitli subjektif ve objektif verileri izlemeye çalışır ancak veri yoğunluğundan bunalır; en belirgin olan verilere odaklanır, bazı önemli bilgileri gözden kaçırır.","Hem subjektif hem de objektif veriler dahil olmak üzere çeşitli verileri düzenli olarak gözlemler ve izler; en yararlı bilgileri fark eder, en ince ayrıntıları kaçırabilir.","Gözleme uygun şekilde odaklanır; yararlı bilgileri ortaya çıkarmak için çok çeşitli subjektif ve objektif verileri düzenli olarak gözlemler ve izler."]},{"asama":"Fark etme","ad":"2. Beklenen örüntülerden sapmaların tanınması","duzey":["Her seferinde tek bir şeye odaklanır; çoğu örüntüyü, beklentilerden sapmaları ve tanılamayı iyileştirme fırsatlarını gözden kaçırır.","Bazı önemli bilgilerin eksik olduğu belirgin örüntüleri ve sapmaları tanımlar; tanılamaya nasıl devam edeceğinden emin değildir.","Verilerdeki en belirgin örüntüleri ve sapmaları tanır. Bunları sürekli olarak tanılamada kullanır.","Verilerdeki ince örüntüleri ve beklenen örüntüden sapmaları tanır. Bunları tanılamayı yönlendirmek için kullanır."]},{"asama":"Fark etme","ad":"3. Bilgi arama","duzey":["Bilgi aramada çaba göstermez; çoğunlukla objektif verilere güvenir, hasta ve ailesiyle etkileşimde zorluk çeker ve önemli subjektif verileri toplamakta başarısız olur.","Hasta ve ailesinden ek bilgi almak için sınırlı çaba gösterir; çoğu zaman hangi bilgiyi arayacağını bilmiyor izlenimi verir ve/veya alakasız bilgileri takip eder.","Girişimleri planlamayı desteklemek için hasta ve ailesinden hastanın durumu hakkında sürekli olarak subjektif veri arar; bazen önemli ipuçlarını takip etmez.","Girişimi planlamak için kendinden emin bir şekilde bilgi arar: hasta ve aileyi gözlemleyerek ve onlarla etkileşimde bulunarak yararlı subjektif verileri dikkatlice toplar."]},{"asama":"Yorumlama","ad":"4. Verileri önceliklendirme","duzey":["Odaklanma güçlüğü çeker ve tanı için hangi verinin en önemli olduğunu bilmiyor gibi görünür; mevcut tüm verileri katmaya çalışır.","Verilere öncelik vermek ve en önemli olana odaklanmak için çaba gösterir, ancak aynı zamanda daha az ilişkili veya yararlı verilerle de ilgilenir.","Genellikle en önemli verilere odaklanır ve daha fazla ilgili bilgi arar ancak daha az ilişkili verilerle de ilgilenmeye çalışabilir.","Hastanın durumunu tanımlamak için yararlı olan en ilişkili ve önemli verilere odaklanır."]},{"asama":"Yorumlama","ad":"5. Veriyi anlamlandırma","duzey":["Basit, yaygın veya tanıdık durumlarda bile verileri yorumlamada veya anlamlandırmada güçlük çeker; birbiriyle çelişen açıklamalar ile uygun girişimler arasında ayrım yapmakta güçlük çeker, hem sorunun teşhisinde hem de girişimin geliştirilmesinde yardıma ihtiyaç duyar.","Basit, yaygın veya tanıdık durumlarda hastanın veri örüntülerini bilinenlerle karşılaştırabilir ve girişim planları geliştirebilir veya açıklayabilir; ancak orta derecede zor verilerde veya öğrencilerin beklentileri dahilindeki durumlarda bile zorluk çeker; basit durumlarda bile tavsiyeye veya yardıma ihtiyaç duyar.","Çoğu durumda, hastanın veri örüntülerini yorumlar ve bir girişim planı ve buna eşlik eden gerekçeyi geliştirmek için bilinen kalıplarla karşılaştırır; istisnalar, bir uzman veya daha deneyimli bir hemşirenin rehberliğine başvurmanın uygun olduğu karmaşık vakalar nadirdir.","Karmaşık, çelişkili veya kafa karıştırıcı verilerle karşılaştığında bile; (a) hastanın verilerindeki örüntüleri not edip anlamlandırabilir, (b) bunları bilinen örüntülerle (hemşirelik bilgi tabanından, araştırmadan, kişisel deneyimden ve sezgiden) karşılaştırabilir ve (c) başarı olasılıkları açısından gerekçelendirilebilecek girişimler için planlar geliştirebilir."]},{"asama":"Yanıt verme","ad":"6. Sakin ve kendinden emin davranma","duzey":["Basit ve rutin durumlar dışında streslidir ve organize olamaz, kontrol eksikliği yaşar, hasta ve aileleri endişelendirir veya çok az iş birliği yapar.","Lider rolünde tereddütlüdür; rutin ve nispeten basit durumlarda hasta ve ailelerine güven verir, ancak kolayca strese girer ve organize olamaz.","Genellikle özgüven ve liderlik sergiler. Çoğu durumu kontrol edebilir veya sakinleştirebilir; özellikle zor veya karmaşık durumlarda stresli davranır.","Sorumluluğu üstlenir; ekibin görev dağılımını yapar, hastaları değerlendirir, onlara ve ailelerine güven verir."]},{"asama":"Yanıt verme","ad":"7. Açık iletişim","duzey":["İletişim kurmakta zorluk çeker; açıklamalar kafa karıştırıcıdır. Talimatlar net değil veya çelişkilidir; hasta ve ailelerin kafası karışır ya da endişelenir ve güvenleri sağlanamaz.","İletişim yeteneğini biraz gösterir (örn. talimat vermek); hastalarla, ailelerle ve ekip üyeleriyle iletişim kısmen başarılıdır; ilgi gösterir ancak yeterlilik göstermez.","Genellikle iyi iletişim kurar; hastalara dikkatlice açıklama yapar, ekibe net talimatlar verir; uyumlu ilişki kurulmasında daha etkili olabilir.","Etkili iletişim kurar; girişimleri açıklar, hasta ve ailelerini sakinleştirir, güven verir. Ekip üyelerini yönlendirir ve dahil eder, açıklama yapar ve talimatlar verir; anlaşılıp anlaşılmadığını kontrol eder."]},{"asama":"Yanıt verme","ad":"8. İyi planlanmış girişim / esneklik","duzey":["Tek bir girişim geliştirmeye odaklanır, olası bir çözümü ele alır, ancak bu net değildir, karışık veya eksik olabilir; az da olsa takip yapmış olabilir.","En belirgin verilere dayanarak girişimler oluşturur; ilerlemeyi izler ancak hastanın yanıtına uygun şekilde düzenleme yapamaz.","İlgili hasta verilerine dayanarak girişimler oluşturur; ilerlemeyi düzenli olarak izler ancak gereken bakım değişikliğini yapması beklenmez.","Girişimler hastaya özgü, bireyseldir; hastadaki ilerlemeyi yakından izler ve hastanın yanıtına göre bakımı yönetir."]},{"asama":"Yanıt verme","ad":"9. Ustalaşma","duzey":["Hemşirelik becerilerini seçmekte ve/veya uygulamakta başarısızdır.","Hemşirelik becerilerini kullanmada kararsız veya etkisizdir.","Çoğu hemşirelik becerisinin kullanımında yeterlilik gösterir; hızı veya doğruluğu artırabilir.","Gerekli hemşirelik becerilerinde ustalık gösterir."]},{"asama":"Yansıtma","ad":"10. Değerlendirme / öz değerlendirme","duzey":["Yönlendirildiğinde bile değerlendirme kısa ve üstünkörüdür, performansını arttırmak için kullanmaz. Bireysel kararları ve seçimleri değerlendirmeden savunur.","En belirgin değerlendirmeleri istendiğinde kısaca ifade eder; alternatif seçenekleri hayal etmekte zorluk çeker, bireysel seçimleri değerlendirmede kendini koruyucu tavır sergiler.","Asgari düzeyde yönlendirmeyle, öncelikle büyük olaylar veya kararlarla ilgili bireysel klinik performansını değerlendirir ve analiz eder; anahtar karar noktaları belirler ve alternatifleri dikkate alır.","Bireysel klinik performansını bağımsız olarak değerlendirir ve analiz eder, karar noktalarını fark eder. Alternatifleri detaylandırır ve seçeneklerini doğru bir şekilde değerlendirir."]},{"asama":"Yansıtma","ad":"11. İyileştirmede kararlılık","duzey":["Performansını iyileştirmeye ilgisiz görünür veya bunu yapamaz; bazen yansıtır, kendisine karşı eleştirel değildir veya aşırı derecede eleştireldir (gelişim seviyesine göre); eksiklerini veya iyileşmeye olan ihtiyacı göremez.","Sürekli iyileştirme ihtiyacının farkındadır ve deneyimlerinden ders çıkarıp performansını artırmak için biraz çabalar, ancak açıkça görüneni ifade etme eğilimindedir ve dış değerlendirmeye ihtiyaç duyar.","Hemşirelik performansını iyileştirme arzusu gösterir; deneyimlerini yansıtır ve değerlendirir, güçlü ve zayıf yönlerini belirler; zayıf yönlerini değerlendirmede daha sistematik olabilir.","Sürekli iyileştirme isteği gösterir; hemşirelik deneyimlerini yansıtır ve eleştirel olarak değerlendirir; güçlü ve zayıf yönlerini doğru bir şekilde belirler ve zayıf yönlerini ortadan kaldırmak için özel planlar geliştirir."]}]},"gonderim":{"adres":"https://script.google.com/macros/s/AKfycbygrLdMEqYcib0Q3Bi3brD5AxI_lI3SPaPdtpqRhAI7o849XD3thoH5Ns-LwG0Ts4De/exec","anahtar":"nst-olcum-7Q4kz2"}},"quizTraces":{"A":{"fs":4,"dur":20,"fhr":[123,123.7,123.7,123.6,121.8,121.7,122.4,123,123.7,124.5,124,123.8,124.6,125.1,125.5,126.7,126.7,126,126.4,125.3,126.4,126,127.2,128.1,128.3,130.2,128.8,130.2,130.5,129.6,131.6,132,132.2,133.1,133.1,132.9,132.6,132.4,132,131.8,132.2,131.4,130.2,129.3,128.5,129.1,128.9,128.8,128.8,127.8,127.9,127.1,126.8,125.8,125.3,125.4,124.7,125.2,124.9,124.1,124.6,123.7,123.3,122.9,121.6       ['Anamnez_Tamlik', 'Anamnez_Tamlik_Yuzde'], ['Ipucu', 'Toplam_Ipucu'], ['Sure_sn', 'Sure_sn']];

    A.proc = m('Uygulama_Yuzde'); A.anam = m('Anamnez_Tamlik_Yuzde'); A.hints = m('Toplam_Ipucu'); A.dur = m('Sure_sn');

  /* ---------------- Trase çizimi (NST kâğıdı) ---------------- */
  NST.drawTrace = function (cv, tr, o) {

    }

    g.setTransform(dpr, 0, 0, dpr, 0, 0);

    g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);

    var x0 = Math.max(0, Math.min(o.x0 || 0, dur - win)), x1 = x0 + win;

    var hAll = H - T - gap - B, hF = Math.round(hAll * 0.72), hU = hAll - hF;

    var pU = { x: L, y: T + hF + gap, w: W - L - Rm, h: hU, y0: 0, y1: 100, major: 25, minor: 10, unit: 'mmHg' };

      g.stroke();

      for (t = Math.ceil(x0 / stepMaj) * stepMaj; t <= x1 + 1e-9; t += stepMaj) { var xM = Math.round(X(p, t)) + 0.5; g.moveTo(xM, p.y); g.lineTo(xM, p.y + p.h); }

    if (an) {

        NST.arr(an.decels).forEach(function (d) { band(pF, d.s, d.e, 'rgba(220,60,50,0.13)'); });

    function line(p, data, color) {
      var fs = tr.fs, i0 = Math.max(0, Math.floor(x0 * 60 * fs)), i1 = Math.min(data.length - 1, Math.ceil(Math.min(x1, upto) * 60 * fs));
      if (i1 <= i0) return;
      var step = Math.max(1, Math.floor((i1 - i0) / (p.w * 2)));
      clip(p, function () {
        g.strokeStyle = color; g.lineWidth = 1.3; g.lineJoin = 'round';
        g.beginPath();
        for (var i = i0; i <= i1; i += step) {
          var x = X(p, i / fs / 60), y = Y(p, data[i]);
          if (i === i0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.stroke();
      });
    }
    line(pF, tr.fhr, '#141a59');
    line(pU, tr.uc, '#1a5a2c');

    clip(pF, function () {
      g.fillStyle = '#222';
      NST.arr(tr.movements).forEach(function (t) {
        if (t > upto) return;
        var x = X(pF, t), y = Y(pF, 56);
        g.beginPath(); g.moveTo(x, y - 6); g.lineTo(x - 5, y + 3); g.lineTo(x + 5, y + 3); g.closePath(); g.fill();
      });
    });
    if (upto < dur) {
      [pF, pU].forEach(function (p) {
        var x = X(p, upto);
        if (x >= p.x && x <= p.x + p.w) { g.strokeStyle = 'rgba(30,90,200,0.8)'; g.lineWidth = 2; g.beginPath(); g.moveTo(x, p.y); g.lineTo(x, p.y + p.h); g.stroke(); }
      });
    }

  /* ---------------- Tarayıcı yardımcıları ---------------- */
  NST.qrSvg = function (text) {

    var blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'application/octet-stream' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  };
  NST.store = {
    get: function (k, def) { try { var v = global.localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
    set: function (k, v) { try { global.localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  };
  NST.copy = function (text) {

<script>
(function () {

const D = window.NST_DATA, P = D.procedure, $ = (s, r) => (r || document).querySelector(s);

// OL = ölçüm oturumu (ön test / son test; tüm gruplar). İpucu, geri bildirim ve puan gösterilmez.

const params = new URLSearchParams(location.search);
let URL_GROUP = parseInt(params.get('grup'), 10); if ([2, 3].indexOf(URL_GROUP) < 0) URL_GROUP = null;
let URL_CASE = parseInt(params.get('vaka'), 10); if (!NST.caseById(D, URL_CASE)) URL_CASE = null;
const URL_ASAMA = ['on', 'son'].indexOf(params.get('asama')) >= 0 ? params.get('asama') : null;

/* ---------- Yerel kayıt (bu cihaz) ---------- */

function nextCase() {
  const done = doneCases(who.code);
  const next = SEQ.find(id => done.indexOf(id) < 0);

/* ---------- Vaka başlat ---------- */
function startCase(c) {
  S = {

    asked: new Set(), nQ: 0, nUnrec: 0, chat: [], transcript: [],

    attempts: [0, 0, 0, 0, 0, 0], firstAns: [null, null, null, null, null, null], firstCorrect: [null, null, null, null, null, null],

}

/* ======================= 1. ANAMNEZ ======================= */

function stage2() {
  const pr = S.proc, cp = S.c.procedure;
  let panel = '';
  if (pr.step === 0) {
    panel = `<p>Gebeyi NST için hangi pozisyona alırsınız?</p><div class="posopt">` +
      P.positions.map(p => `<button class="btn" data-pos="${p.id}">${esc(p.label)}</button>`).join('') + `</div>`;
  } else if (pr.step === 1) {
    const need = OL || ['fundus', 'sag', 'sol'].every(k => pr.palp[k]);
    panel = `<p class="small">${esc(P.text.leopoldIntro)}</p>
      <div class="small muted">${OL ? 'Palpasyon yapmak istediğiniz bölgelere dokunun. Hazır olduğunuzda kararınızı verin.' : 'Karın üzerindeki bölgelere dokunun: fundus, hastanın sağ ve sol yanı, simfiz üstü.'}</div>
      ${pr.leoFinds.map(f => `<div class="find"><b>${esc(f.label)}:</b> ${esc(f.text)}</div>`).join('')}
      <div class="${need ? '' : 'hidden'}" style="margin-top:10px">
        <div class="form" style="grid-template-columns:130px 1fr">
          <label for="back">Fetal sırt</label><select id="back"><option value="">Seçiniz</option><option value="sag">Hastanın sağında</option><option value="sol">Hastanın solunda</option></select>
          <label for="pres">Gelen kısım</label><select id="pres"><option value="">Seçiniz</option><option>Baş (verteks)</option><option>Makat</option></select>
        </div>
        <button class="btn pri block" id="leoBtn" style="margin-top:8px">Kararımı onayla</button>
      </div>`;
  } else if (pr.step === 2 || pr.step === 3) {
    const tools = pr.step === 2 ? ['toco'] : ['gel', 'doppler'];
    const names = { toco: 'Toko probu', gel: 'Jel', doppler: 'Ultrason (Doppler) probu' };
    panel = `<p class="small">${pr.step === 2 ? 'Toko probunu seçip karında doğru bölgeye sürükleyin ya da dokunun.'
      : OL ? 'Araçları kullanarak Doppler probunu hazırlayın ve fetal kalp sesinin en iyi alınacağı bölgeye yerleştirin. Bir aracı başka bir araca ya da proba sürükleyebilir veya dokunabilirsiniz.'
      : 'Önce <b>jeli</b> seçip <b>Doppler probuna</b> dokunun (ya da sürükleyin). Sonra Doppler probunu fetal kalp sesinin en iyi alınacağı bölgeye yerleştirin.'}</p>
      <div class="tools" id="tools">${tools.map(t => `<button class="tool ${pr.tool === t ? 'sel' : ''}" data-tool="${t}">${toolIcon(t)}${names[t]}</button>`).join('')}</div>
      ${pr.tool ? `<div class="small muted" style="margin-top:6px">Seçili: <b>${names[pr.tool]}</b></div>` : ''}`;
  } else {
    panel = `<p>${esc(P.text.startReady)}</p><div class="heart">${OL ? 'FKH sinyali alınıyor' : `FKH sinyali: ~${S.c.key.baseline} atım/dk`}</div>
      <button class="btn pri block" id="recBtn" style="margin-top:12px">Kaydı başlat ▶</button>`;
  }
  app.innerHTML = `<div class="grid">
    <div class="card ill" id="ill">${illustration()}</div>
    <div class="stack">${personaHtml()}
      <div class="card"><h2>NST'ye hazırlık ve uygulama</h2>
        <ol class="steps">${PROC_STEPS.map((n, i) => `<li class="${i === pr.step ? 'on' : (i < pr.step ? 'ok' : '')}">${i < pr.step ? '✔ ' : ''}${n}</li>`).join('')}</ol>
        <div style="margin-top:12px">${panel}</div>
        <div class="fb">${pr.fb.map(f => `<div class="${f.kind}">${esc(f.text)}</div>`).join('')}</div>
      </div></div></div>`;
  bindStage2();
}

function bindStage2() {
  const pr = S.proc, cp = S.c.procedure;
  app.querySelectorAll('[data-pos]').forEach(b => b.onclick = () => {
    const p = P.positions.find(x => x.id === b.dataset.pos);
    log(`[Uygulama] Pozisyon: ${p.label}${p.correct ? '' : ' (hatalı)'}`);
    setBit(0, p.correct);
    if (OL) { pr.posOk = !!p.correct; pr.posLabel = p.label; if (!p.correct) pr.errors++; pr.step = 1; pfb('info', 'Pozisyon kaydedildi: ' + p.label); }
    else if (p.correct) { pr.step = 1; pfb('ok', p.feedback); }
    else {
      pr.errors++;
      S.proc.fb = [{ kind: 'bad', text: p.feedback }];
      if (p.id === 'supin' && cp.supineReaction) S.proc.fb.unshift({ kind: 'warn', text: `${S.c.persona.ad}: "${cp.supineReaction}"` });
    }
    stage2();
  });
  const leoBtn = $('#leoBtn');
  if (leoBtn) leoBtn.onclick = () => {
    const back = $('#back').value, pres = $('#pres').value;
    if (!back || !pres) { pfb('warn', 'Her iki alanı da seçin.'); return stage2(); }
    const ok = back === cp.backSide && pres === cp.presentation;
    log(`[Uygulama] Leopold kararı: sırt ${back}, gelen kısım ${pres}${ok ? '' : ' (hatalı)'}`);
    setBit(1, ok);
    if (OL) { pr.leoChoice = { sirt: back, gelis: pres }; if (!ok) pr.errors++; pr.step = 2; pfb('info', 'Leopold kararınız kaydedildi.'); }
    else if (ok) { pr.step = 2; pfb('ok', P.text.leopoldRight); }
    else { pr.errors++; pfb('bad', P.text.leopoldWrong); }
    stage2();
  };
  const recBtn = $('#recBtn');
  if (recBtn) recBtn.onclick = () => { log('--- NST kaydı başlatıldı ---'); S.recording = true; goNext(); startRecording(); };
  $('#ill').addEventListener('click', e => {
    const z = e.target.closest('[data-zone]');
    if (z) handleZone(z.dataset.zone);
  });
  const tools = $('#tools');
  if (tools) {
    tools.addEventListener('pointerdown', onToolDown);
    tools.addEventListener('click', e => {           // klavye (Enter/Boşluk) ile seçim
      const b = e.target.closest('[data-tool]');
      if (!b || e.detail !== 0) return;
      if (pr.tool === 'gel' && b.dataset.tool === 'doppler') return applyGelToDoppler();
      pr.tool = pr.tool === b.dataset.tool ? null : b.dataset.tool; stage2();
    });
  }
}

function handleZone(z, toolOverride) {
  const pr = S.proc, cp = S.c.procedure;
  const tool = toolOverride || pr.tool;
  if (z.indexOf('L:') === 0) {
    const id = z.slice(2);
    if (!pr.palp[id]) {
      pr.palp[id] = true;
      const lz = P.leopoldZones.find(x => x.id === id);
      pr.leoFinds.push({ label: lz ? lz.label : id, text: cp.leopold[id] });
      log(`[Uygulama] Leopold: ${lz ? lz.label : id}`);
    }
    pr.fb = [];
    return stage2();
  }
  if (z === 'TOCO') {
    if (tool === 'gel') {
      log('[Uygulama] Jel toko probuna sürüldü (hatalı)'); setBit(3, false); pr.errors++; pr.tool = null;
      if (OL) { pr.gelOnToco = true; pfb('info', 'Jel toko probuna sürüldü.'); } else pfb('bad', P.text.gelOnToco);
    }
    return stage2();
  }
  if (z.indexOf('P:') !== 0) return;
  const id = z.slice(2);
  if (!tool) { pfb('info', 'Önce araçlardan birini seçin.'); return stage2(); }
  if (tool === 'toco' && pr.step === 2) {
    log(`[Uygulama] Toko probu: ${zoneLabel(id)}${id === 'fundus' ? '' : ' (hatalı)'}`);
    setBit(2, id === 'fundus');
    if (OL) { if (id !== 'fundus') pr.errors++; pr.toco = id; pr.step = 3; pr.tool = null; pfb('info', 'Toko probu yerleştirildi: ' + zoneLabel(id)); }
    else if (id === 'fundus') { pr.toco = id; pr.step = 3; pr.tool = null; pfb('ok', P.text.tocoRight); }
    else { pr.errors++; pfb('bad', P.text.tocoWrong); }
  } else if (tool === 'gel') {
    pfb('info', OL ? 'Jel seçili. Sürmek istediğiniz proba dokunun.' : 'Jeli probun üzerine sürün: Jel seçiliyken Doppler probuna dokunun.');
  } else if (tool === 'doppler' && pr.step === 3 && OL) {
    const ok = id === cp.dopplerZone;
    if (!pr.gel) { log('[Uygulama] Doppler jelsiz yerleştirildi (hatalı)'); setBit(3, false); pr.errors++; }
    log(`[Uygulama] Doppler probu: ${zoneLabel(id)}${ok ? '' : ' (hatalı)'}`);
    setBit(4, ok); if (!ok) pr.errors++;
    pr.doppler = id; pr.step = 4; pr.tool = null; pfb('info', 'Doppler probu yerleştirildi: ' + zoneLabel(id));
  } else if (tool === 'doppler' && pr.step === 3) {
    if (!pr.gel) { log('[Uygulama] Doppler jelsiz yerleştirilmek istendi (hatalı)'); setBit(3, false); pr.errors++; pfb('bad', P.text.dopplerNoGel); }
    else {
      const ok = id === cp.dopplerZone;
      log(`[Uygulama] Doppler probu: ${zoneLabel(id)}${ok ? '' : ' (hatalı)'}`);
      setBit(4, ok);
      if (ok) { pr.doppler = id; pr.step = 4; pr.tool = null; pfb('ok', P.text.dopplerRight); }
      else { pr.errors++; pfb('bad', P.text.dopplerWrong); }
    }
  }
  stage2();
}

function applyGelToDoppler() {
  const pr = S.proc;
  if (!pr.gel) { log('[Uygulama] Jel Doppler probuna sürüldü'); setBit(3, true); pr.gel = true; pfb(OL ? 'info' : 'ok', OL ? 'Jel Doppler probuna sürüldü.' : P.text.gelRight); }
  pr.tool = 'doppler';
  stage2();
}

let drag = null;
function onToolDown(e) {
  const b = e.target.closest('[data-tool]'); if (!b || b.disabled) return;
  e.preventDefault();
  drag = { tool: b.dataset.tool, x: e.clientX, y: e.clientY, moved: false, ghost: null };
  window.addEventListener('pointermove', onToolMove);
  window.addEventListener('pointerup', onToolUp, { once: true });
}
function onToolMove(e) {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
    drag.moved = true;
    drag.ghost = document.createElement('div'); drag.ghost.className = 'ghost';
    drag.ghost.textContent = { toco: 'TOKO', gel: 'JEL', doppler: 'US' }[drag.tool];
    document.body.appendChild(drag.ghost);
  }
  if (drag.ghost) { drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px'; }
}
function onToolUp(e) {
  window.removeEventListener('pointermove', onToolMove);
  const d = drag; drag = null; if (!d) return;
  if (d.ghost) d.ghost.remove();
  const pr = S.proc;
  if (!d.moved) { // dokunma: seçim
    if (pr.tool === 'gel' && d.tool === 'doppler') return applyGelToDoppler();
    pr.tool = pr.tool === d.tool ? null : d.tool;
    return stage2();
  }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (!el) return;
  const zone = el.closest('[data-zone]'), toolBtn = el.closest('[data-tool]');
  if (d.tool === 'gel' && toolBtn && toolBtn.dataset.tool === 'doppler') return applyGelToDoppler();
  if (zone) { pr.tool = d.tool; handleZone(zone.dataset.zone, d.tool); }
}

/* ======================= 3. TRASE YORUMU ======================= */
function traceCard(title) {
  const dur = S.c.trace.dur;
  return `<div class="card tracewrap"><h2>${title}</h2>
    <canvas id="cv" aria-label="NST trasesi: fetal kalp hızı ve uterus aktivitesi"></canvas>
    <div class="tracectl">
      <span class="small muted">Kaydır:</span>
      <input type="range" id="pan" min="0" max="${Math.max(0, dur - view.win)}" step="0.1" value="${view.x0}" ${view.win >= dur ? 'disabled' : ''}>
      <select id="win"><option value="10" ${view.win < dur ? 'selected' : ''}>10 dk pencere</option><option value="${dur}" ${view.win >= dur ? 'selected' : ''}>Tüm kayıt (${dur} dk)</option></select>
      <span id="recState"></span>
    </div>
    <div class="small muted" style="margin-top:4px">Kâğıt hızı 1 cm/dk · ▲ fetal hareket (gebe bildirimi) · Kaydı parmağınızla/fareyle sürükleyerek de kaydırabilirsiniz.</div></div>`;
}
function draw() {
  if (!canvas) return;
  NST.drawTrace(canvas, S.c.trace, { x0: view.x0, win: view.win, upto: view.upto, highlights: view.highlights, analysis: view.analysis });
}
function bindTrace() {
  canvas = $('#cv');
  const pan = $('#pan'), win = $('#win'), dur = S.c.trace.dur;
  pan.oninput = () => { view.x0 = parseFloat(pan.value); draw(); };
  win.onchange = () => {
    view.win = parseFloat(win.value);
    pan.max = Math.max(0, dur - view.win); pan.disabled = view.win >= dur;
    view.x0 = Math.min(view.x0, Math.max(0, dur - view.win)); pan.value = view.x0; draw();
  };
  let dragX = null, startX0 = 0;
  canvas.onpointerdown = e => { if (view.win >= dur) return; dragX = e.clientX; startX0 = view.x0; canvas.setPointerCapture(e.pointerId); };
  canvas.onpointermove = e => {
    if (dragX == null) return;
    const dxMin = (e.clientX - dragX) / canvas.clientWidth * view.win;
    view.x0 = Math.max(0, Math.min(dur - view.win, startX0 - dxMin)); pan.value = view.x0; draw();
  };
  canvas.onpointerup = canvas.onpointercancel = () => { dragX = null; };
  draw();
}
function setRecState() {
  const el = $('#recState'); if (!el) return;
  el.innerHTML = view.upto != null ? '<span class="rec">Kayıt sürüyor (hızlandırılmış)</span>' : '';
}
function startRecording() {
  const dur = S.c.trace.dur, ms = dur >= 40 ? 11000 : 7500, t0 = performance.now();
  view.upto = 0; view.empty = false;
  setRecState();
  function frame(now) {
    if (!S || stageKey() !== 'trase' || !S.recording) return;
    const f = Math.min(1, (now - t0) / ms);
    view.upto = f * dur;
    if (view.win < dur) view.x0 = Math.max(0, Math.min(dur - view.win, view.upto - view.win * 0.85));
    const pan = $('#pan'); if (pan) pan.value = view.x0;
    draw();
    if (f < 1) requestAnimationFrame(frame);
    else { view.upto = null; view.x0 = 0; if (pan) pan.value = 0; S.recording = false; log('--- NST kaydı tamamlandı ---'); stage3(); }
  }
  requestAnimationFrame(frame);
}

function stage3() {
  const dis = S.recording ? 'disabled' : '';
  const rows = D.items.labels.map((lab, i) => {
    const lock = S.done[i] ? 'disabled' : dis;
    let input;
    // ölçümde kilitli alan öğrencinin kendi yanıtını gösterir (doğru yanıt gösterilmez)
    if (i === 0) input = `<input type="number" id="f0" min="50" max="210" step="1" placeholder="atım/dk" ${lock} value="${S.done[0] && !OL ? S.c.key.baseline : (S.lastVals ? S.lastVals[0] || '' : '')}" class="${S.done[0] ? 'locked' : ''}">`;
    else {
      const cur = S.done[i] && !OL ? D.items.opts[i].indexOf(String(NST.keyValue(D, S.c, i))) : (S.lastVals ? S.lastVals[i] : '');
      input = `<select id="f${i}" ${lock} class="${S.done[i] ? 'locked' : ''}"><option value="">Seçiniz</option>${D.items.opts[i].map((o, k) => `<option value="${k}" ${String(cur) === String(k) ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    }
    return `<label for="f${i}">${esc(lab)}</label>${input}`;
  }).join('');
  app.innerHTML = `<div class="grid">${traceCard(S.c.trace.dur + ' dakikalık NST kaydı')}
    <div class="stack">${personaHtml()}
      <div class="card"><h2>Trase yorumu</h2>
        <p class="small muted" style="margin-top:0">${S.recording ? 'Kayıt tamamlanınca değerlendirme alanları açılacak.'
          : OL ? 'Kaydı inceleyin ve her bileşeni değerlendirin. Yanıtlarınızı bir kez onaylayabilirsiniz; doğru ya da yanlış bilgisi verilmez.'
          : 'Kaydı inceleyin ve her bileşeni değerlendirin. Yanlış yanıtlarda en fazla 3 aşamalı ipucu alırsınız.'}</p>
        <div class="form">${rows}</div>
        <div class="row" style="margin-top:12px">
          <button class="btn pri grow" id="evalBtn" ${OL && S.done.every(Boolean) ? 'disabled' : dis}>${OL ? 'Yanıtlarımı onayla' : 'Değerlendir'}</button>
          <button class="btn grow" id="next3" ${S.done.every(Boolean) ? '' : 'disabled'}>Klinik karara geç ▶</button>
        </div>
        <div class="fb">${S.interpFb.map(f => `<div class="${f.kind}">${esc(f.text)}</div>`).join('')}</div>
      </div></div></div>`;
  bindTrace(); setRecState();
  $('#evalBtn').onclick = evaluateInterp;
  $('#next3').onclick = () => { view.highlights = []; goNext(); };
}

function evaluateInterp() {
  const c = S.c, vals = [];
  for (let i = 0; i < 6; i++) vals.push($('#f' + i).value);
  S.lastVals = vals.slice();
  for (let i = 0; i < 6; i++) if (!S.done[i] && vals[i] === '') { S.interpFb = [{ kind: 'warn', text: 'Lütfen tüm alanları doldurun.' }]; return stage3(); }
  if (OL) {     // tek gönderim, geri bildirim yok
    if (!confirm('Yanıtlarınızı onaylıyor musunuz? Onayladıktan sonra değiştiremezsiniz.')) return;
    for (let i = 0; i < 6; i++) {
      const val = i === 0 ? Number(vals[0]) : D.items.opts[i][Number(vals[i])];
      S.firstAns[i] = i === 0 ? Number(vals[0]) : Number(vals[i]);
      S.firstCorrect[i] = NST.isCorrect(D, c, i, val) ? 1 : 0;
      S.done[i] = true;
      log(`[Yorum] ${D.items.labels[i]}: ${val}`);
    }
    S.interpFb = [{ kind: 'info', text: 'Yanıtlarınız kaydedildi. Klinik karar aşamasına geçebilirsiniz.' }];
    return stage3();
  }
  const fb = [], regions = [];
  for (let i = 0; i < 6; i++) {
    if (S.done[i]) continue;
    const id = D.items.ids[i], lab = D.items.labels[i];
    const val = i === 0 ? Number(vals[0]) : D.items.opts[i][Number(vals[i])];
    const ok = NST.isCorrect(D, c, i, val);
    if (S.attempts[i] === 0 && S.firstAns[i] === null) S.firstAns[i] = i === 0 ? Number(vals[0]) : Number(vals[i]);
    if (S.firstCorrect[i] === null) S.firstCorrect[i] = ok ? 1 : 0;
    if (ok) { S.done[i] = true; fb.push({ kind: 'ok', text: `✔ ${lab}: Doğru.` }); log(`[Yorum] ${lab}: ${val} (doğru)`); }
    else {
      S.attempts[i]++;
      const k = S.attempts[i];
      log(`[Yorum] ${lab}: ${val} (yanlış, ipucu ${k})`);
      let t = `✘ ${lab} – İpucu ${k}/3: ${c.hints[id][k - 1]}`;
      if (k === 2) { regions.push(NST.arr(c.hintRegion[id])); t += ' (Trasede sarı bölgeye bakın.)'; }
      if (k >= 3) { S.done[i] = true; t += ' → Doğru yanıt forma işlendi.'; }
      fb.push({ kind: k >= 3 ? 'info' : 'bad', text: t });
    }
  }
  view.highlights = regions;
  if (regions.length) {
    const r = regions[0], dur = c.trace.dur;
    if (r[1] - r[0] > 10) view.win = dur;
    else { if (view.win >= dur) view.win = Math.min(10, dur); view.x0 = Math.max(0, Math.min(dur - view.win, r[0] - 1)); }
  }
  const nDone = S.done.filter(Boolean).length;
  fb.push({ kind: 'info', text: `Tamamlanan madde: ${nDone}/6` + (nDone === 6 ? ' – Trase yorumu tamamlandı. Klinik karar aşamasına geçebilirsiniz.' : '') });
  S.interpFb = fb;
  stage3();
}

/* ======================= 4. KLİNİK KARAR ======================= */
function stage4() {
  const c = S.c, order = NST.arr(c.decOrder), locked = !!S.dec;
  const sel = locked ? S.dec.sel : (S.decDraft || []);
  const opts = order.map(k => `<label><input type="checkbox" value="${k}" ${sel.indexOf(k) >= 0 ? 'checked' : ''} ${locked ? 'disabled' : ''}><span>${esc(c.decisions[k].text)}</span></label>`).join('');
  const prOpts = order.map(k => `<option value="${k}" ${locked && S.dec.pr === k ? 'selected' : ''}>${esc(c.decisions[k].text)}</option>`).join('');
  let fb = '';
  if (S.decHints && !locked) fb = NST.arr(c.decisionHints).slice(0, S.decHints).map((h, i) => `<div class="info">İpucu ${i + 1}: ${esc(h)}</div>`).join('');
  if (locked && OL) fb = '<div class="info">Kararınız kaydedildi.</div>';
  else if (locked) {
    const r = NST.scoreDecisions(c, S.dec.sel, S.dec.pr);
    fb = `<div class="info">Doğru seçilen: ${r.TP}/${r.nC} · Yanlış seçilen: ${r.FP} · Karar puanı: %${r.score}</div>` +
      order.map(k => {
        const d = c.decisions[k], s = S.dec.sel.indexOf(k) >= 0;
        const m = s && d.correct ? ['ok', '✔ Doğru seçim'] : s ? ['bad', '✘ Yanlış seçim'] : d.correct ? ['warn', '○ Atlanan doğru girişim'] : ['info', '– Doğru biçimde seçilmedi'];
        return `<div class="${m[0]}"><b>${m[1]}:</b> ${esc(d.text)}<br><span class="small">Gerekçe: ${esc(d.why)}</span></div>`;
      }).join('') +
      (r.prOK ? `<div class="ok">✔ Öncelik doğru: ${esc(c.decisions[S.dec.pr].text)}</div>`
        : `<div class="bad">✘ Öncelik: Sizin seçiminiz "${esc(c.decisions[S.dec.pr].text)}". Öncelikli girişim: "${esc(c.decisions[c.priorityIdx].text)}". ${esc(c.decisions[c.priorityIdx].why)}</div>`);
  }
  app.innerHTML = `<div class="grid">${traceCard('NST kaydı')}
    <div class="stack">${personaHtml()}
      <div class="card"><h2>Klinik karar</h2>
        <p class="small muted" style="margin-top:0">Trase yorumunuza ve anamnez bulgularına göre uygun hemşirelik girişimlerinin <b>tümünü</b> seçin. Yanlış seçimler puanı düşürür.</p>
        <div class="opts" id="opts">${opts}</div>
        <h3>İlk (öncelikli) olarak yapılması gereken girişim</h3>
        <select id="prio" style="width:100%" ${locked ? 'disabled' : ''}><option value="">Seçiniz</option>${prOpts}</select>
        <div class="row" style="margin-top:12px">

function buildRecord() {

    v: 1, code: who.code, group: who.group, caseId: c.id, start: S.startEpoch, dur: Math.round((Date.now() - S.t0) / 1000),
    nQ: S.nQ, nUnrec: S.nUnrec, covered: NST.arr(c.critical).map(id => S.asked.has(id) ? 1 : 0),
    firstAns: S.firstAns.map(x => x == null ? -1 : x), firstCorrect: S.firstCorrect.map(x => x ? 1 : 0), attempts: S.attempts.slice(),
    sel: S.dec.sel.slice().sort((a, b) => a - b), pr: S.dec.pr, decHints: S.decHints,
    proc: { bits: S.proc.bits.map(b => b ? 1 : 0), errors: S.proc.errors }, transcript: S.transcript.slice()
  };
}
function qrBlock(records, title) {
  const payload = NST.encodePayload(records);

    <div class="qr">${svg ? `<div class="svg">${svg}</div>` : '<div class="warn small">QR kodu oluşturulamadı (internet bağlantısı gerekli olabilir). Lütfen aşağıdaki seçenekleri kullanın.</div>'}
      <div class="stack" style="gap:8px;flex:1 1 220px">

        <details><summary class="small muted">Kodu göster</summary><div class="code">${esc(payload)}</div></details>
      </div></div></div>`;
}
function bindQr() {
  app.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => NST.copy(b.dataset.copy).then(() => { b.textContent = '✔ Kopyalandı'; }));

}

function olMissing() {
  const m = [];
  if (!F.onamMetni) m.push('gönüllü olur metni');
  if (F.kisiselTaslak) m.push('Kişisel Bilgi Formu taslak (EK 4 ile eşleştirilmeli)');
  if (!NST.arr(F.bilgiTesti).length) m.push('NST Bilgi Testi soruları');
  if (!F.olcek || !NST.arr(F.olcek.maddeler).length) m.push('ölçek maddeleri');
  if (!F.gonderim || !F.gonderim.adres) m.push('otomatik gönderim adresi');
  return m;
}
const olKey = (code, asama) => code.toUpperCase() + '|' + asama;
function olRecords() { return NST.store.get('nst_o_records', []); }
function olSaveLocal(r) { const all = olRecords(); all.push({ r, sent: false }); NST.store.set('nst_o_records', all); }
function olMarkSent(r) { const all = olRecords(); all.forEach(x => { if (x.r.id === r.id) x.sent = true; }); NST.store.set('nst_o_records', all); }
function olDone(code, asama) { return olRecords().some(x => olKey(x.r.kod, x.r.asama) === olKey(code, asama)); }
function olFileName(r) { return `${r.kod}_${r.asama === 'on' ? 'ontest' : 'sontest'}.json`; }

function sendRecord(rec) {
  const url = F.gonderim && F.gonderim.adres;
  if (!url) return Promise.reject(new Error('gönderim adresi tanımlı değil'));
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 25000) : null;
  // Content-Type belirtilmez (text/plain): ön kontrol (preflight) isteği gerekmez
  return fetch(url, { method: 'POST', body: JSON.stringify({ anahtar: F.gonderim.anahtar, kayit: rec }), signal: ctl ? ctl.signal : undefined })
    .then(res => res.json())
    .then(j => { if (!j || !j.ok) throw new Error((j && j.hata) || 'sunucu hatası'); return j; })
    .catch(e => { throw new Error(e && e.name === 'AbortError' ? 'zaman aşımı' : (e.message || 'bağlantı hatası')); })
    .finally(() => { if (timer) clearTimeout(timer); });
}
function flushPending() {      // önceki gönderilemeyen kayıtları sessizce yeniden dene
  olRecords().filter(x => !x.sent).reduce((p, x) => p.then(() => sendRecord(x.r).then(() => olMarkSent(x.r)).catch(() => {})), Promise.resolve());
}

  app.innerHTML = olCard(esc(O.ad || 'Ölçek'), body, 'oBtn');
  $('#oBtn').onclick = () => {
    const out = [];
    for (let i = 0; i < items.length; i++) {
      const r = app.querySelector(`input[name="o${i}"]:checked`);
      if (!r) return olErr(`Lütfen ${i + 1}. maddeyi yanıtlayın.`);
      out.push(Number(r.value));
    }
    S.olcek = out;
    log('[Ölçek] Yanıtlandı');
    goNext();
  };
}

function buildOlcumRecord() {
  const c = S.c, pr = S.proc, now = Date.now(), dec = NST.scoreDecisions(c, S.dec.sel, S.dec.pr);
  const qs = NST.arr(F.bilgiTesti), O = F.olcek || {}, ters = NST.arr(O.ters).map(Number);
  const rec = {
    format: 'NST-olcum', version: 1, surum: D.generated,
    id: `${who.code}|${who.asama}|${S.startEpoch}`,
    kod: who.code, asama: who.asama, oturum: who.oturum,
    baslangic: S.startEpoch, bitis: Math.floor(now / 1000), sure_sn: Math.round((now - S.t0) / 1000),
    onam: S.onam || null, kisisel: S.kisisel || null,
    vaka: {
      vakaNo: c.id, sure_sn: S.caseT0 && S.caseT1 ? Math.round((S.caseT1 - S.caseT0) / 1000) : null,
      soruSay: S.nQ, anlasilmayan: S.nUnrec, kritik: NST.arr(c.critical),
      kapsanan: NST.arr(c.critical).map(id => S.asked.has(id) ? 1 : 0),
      uygulama: {
        bitler: pr.bits.map(b => b ? 1 : 0), hata: pr.errors, pozisyon: pr.posLabel || '',
        leopold: { palpe: Object.keys(pr.palp), sirt: (pr.leoChoice || {}).sirt || '', gelis: (pr.leoChoice || {}).gelis || '' },
        toko: pr.toco || '', doppler: pr.doppler || '', jelDoppler: !!pr.gel, jelToko: !!pr.gelOnToco
      },
      yorum: {
        yanitlar: S.firstAns.slice(), etiketler: S.firstAns.map((a, i) => NST.answerLabel(D, i, a)),
        dogru: S.firstCorrect.slice(), dogruSayi: S.firstCorrect.reduce((s, x) => s + (x ? 1 : 0), 0)
      },
      karar: {
        secilen: S.dec.sel.slice().sort((a, b) => a - b), secilenMetin: S.dec.sel.map(k => c.decisions[k].text),
        oncelik: S.dec.pr, oncelikMetin: c.decisions[S.dec.pr].text, oncelikDogru: dec.prOK ? 1 : 0,
        dogruSecilen: dec.TP, yanlisSecilen: dec.FP, dogruToplam: dec.nC, puan: dec.score
      },
      sbar: S.sbar || null,
      transcript: S.transcript.slice()
    },
    yansitma: S.yansitma || null,
    bilgiTesti: null, olcek: null
  };
  if (who.asama === 'son' && S.bilgi) {
    const dogru = S.bilgi.map((a, i) => a === Number(qs[i].dogru) ? 1 : 0);
    rec.bilgiTesti = { yanitlar: S.bilgi.slice(), dogru, dogruSayi: dogru.reduce((s, x) => s + x, 0), soruSayi: qs.length };
  }
  if (who.asama === 'son' && S.olcek) {
    const puan = S.olcek.map((v, i) => ters.indexOf(i + 1) >= 0 ? 6 - v : v);
    rec.olcek = { yanitlar: S.olcek.slice(), toplam: puan.reduce((s, x) => s + x, 0), tersMaddeler: ters };
  }
  return rec;
}

function stGonder() {
  if (!S.olRecord) { S.olRecord = buildOlcumRecord(); olSaveLocal(S.olRecord); S.finished = true; }
  const r = S.olRecord, fname = olFileName(r);
  $('#caseTitle').textContent = '';
  app.innerHTML = `<div class="card center"><h2>Teşekkürler, oturum tamamlandı ✔</h2>
    <p>Yanıtlarınız kaydedildi ve araştırmacıya otomatik olarak gönderiliyor.</p>
    <div class="status wait" id="sendState">Gönderiliyor…</div>
    <p style="margin-top:14px">Yedek olarak sonuç dosyanızı bilgisayara da kaydedin. Dosyanın adı: <b>${esc(fname)}</b></p>
    <div class="row"><button class="btn pri grow" id="dlBtn">Sonuç dosyasını bilgisayara kaydet</button><button class="btn grow hidden" id="retryBtn">Yeniden gönder</button></div>
    <p class="small muted">Puanınız bu ekranda gösterilmez. Lütfen bu ekranı kapatmadan araştırmacıya haber verin.</p></div>`;
  const setState = (k, t) => { const el = $('#sendState'); if (el) { el.className = 'status ' + k; el.textContent = t; } };
  $('#dlBtn').onclick = () => { NST.download(fname, JSON.stringify(r, null, 1), 'application/json'); $('#dlBtn').textContent = '✔ Kaydedildi (yeniden kaydetmek için tıklayın)'; };
  const attempt = () => {
    setState('wait', 'Gönderiliyor…');
    $('#retryBtn').classList.add('hidden');
    sendRecord(r).then(() => { olMarkSent(r); setState('ok', '✔ Sonuçlarınız araştırmacıya iletildi.'); })
      .catch(e => { setState('bad', `✘ Gönderilemedi (${e.message}). Lütfen sonuç dosyasını kaydedin ve araştırmacıya haber verin.`); $('#retryBtn').classList.remove('hidden'); });
  };
  $('#retryBtn').onclick = attempt;
  attempt();
}

window.addEventListener('resize', () => {
  if (S && canvas && document.body.contains(canvas)) draw();
  if (S && stageKey() === 'bilgi') drawQuizTraces();
});

// Otomatik testler için arayüz (öğrenciye görünmez)
window.NSTStudent = {
  state: () => S, login: (code, group) => { who.code = code; who.group = group; nextCase(); },
  olLogin: (code, asama, oturum) => { who.code = code; who.asama = asama; who.oturum = oturum; startCase(D.assess); },
  stage: () => stageKey(), next: () => goNext(), showLogin: () => (OL ? showLoginOL() : showLogin()),
  ask: q => { ask(q); if (stageKey() === 'anamnez') stage1(); }, vitals: () => $('#vitBtn').click(),
  endAnamnesis: () => goNext(), zone: z => handleZone(z), tool: t => { S.proc.tool = t; stage2(); },
  gel: applyGelToDoppler, finishRecording: () => { view.upto = null; S.recording = false; stage3(); },
  render: () => render()
};

if (OL) { showLoginOL(); flushPending(); } else showLogin();
})();
</script>
